<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CVPILOT – Your Resume. Audited. Improved. Ready.</title>
<style>
:root{--bg:#0a1020;--card:#111a30;--line:#22304f;--txt:#e8ecf8;--mut:#93a0bd;--blue:#4f7cff;--lav:#b3a8ff;--ok:#3ecf8e;--warn:#f5b942;--bad:#ff6b7a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f7ff;--card:#fff;--line:#d9e0f2;--txt:#12182b;--mut:#56627f;--blue:#3a63e8;--lav:#6c5ce0;--ok:#0e9f66;--warn:#b7791f;--bad:#d6293e;color-scheme:light}}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 20px}
.logo{font-weight:800;letter-spacing:.04em;font-size:18px;cursor:pointer;background:none;border:0;color:var(--txt)}.logo b{color:var(--lav)}
nav{display:flex;gap:8px}@media(max-width:620px){header{flex-wrap:wrap;gap:8px}header nav{width:100%;overflow-x:auto;padding-bottom:2px}header nav .btn{white-space:nowrap}}
.btn{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:9px 16px;cursor:pointer;transition:.15s}.btn:hover{border-color:var(--blue);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,var(--blue),#7b6cff);border:0;color:#fff}.btn.sm{padding:3px 10px;font-size:12px;font-weight:600}
main{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
.hero{padding:56px 0 32px;text-align:center}.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.1;margin:0 0 16px;letter-spacing:-.02em}.hero h1 span{background:linear-gradient(90deg,var(--blue),var(--lav));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);max-width:620px;margin:0 auto 24px;font-size:17px}.row{display:flex;gap:10px;flex-wrap:wrap}.hero .row{justify-content:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}.card h3{margin:0 0 6px;font-size:16px}.card p{margin:0;color:var(--mut)}
h2{font-size:22px;margin:30px 0 12px;letter-spacing:-.01em}
textarea{width:100%;min-height:260px;resize:vertical;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:14px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace}textarea:focus{outline:2px solid var(--blue);border-color:transparent}
label{font-weight:600;display:block;margin:0 0 8px}.err{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);border-radius:10px;padding:10px 14px;margin-top:14px}
.chip{display:inline-block;padding:3px 11px;border-radius:99px;font-size:13px;font-weight:600;margin:3px 4px 3px 0;border:1px solid}
.chip.ok{color:var(--ok);border-color:var(--ok)}.chip.bad{color:var(--bad);border-color:var(--bad)}
.score{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;flex:none}.ring div{width:92px;height:92px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:28px;font-weight:800}
.sev{font-size:11px;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:6px;margin-right:8px}.sev.high{background:var(--bad);color:#fff}.sev.medium{background:var(--warn);color:#111}.sev.low,.sev.info{background:var(--line);color:var(--txt)}
.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0}.mut{color:var(--mut)}.diff{margin:6px 0;padding:8px 12px;border-radius:8px;background:var(--bg)}
mark{background:color-mix(in srgb,var(--warn) 35%,transparent);color:inherit;border-radius:4px;padding:0 2px}.box{white-space:pre-wrap;max-height:260px;overflow:auto;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);padding:12px;border-radius:10px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;padding:8px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:20}#toast.on{opacity:1}
ol{padding-left:20px;margin:0}ol li{margin:6px 0}
.page-head,.workspace-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:10px 0 24px}.page-head h1,.workspace-head h1{margin:4px 0 7px}.page-head p,.workspace-head p{margin:0;color:var(--mut)}.eyebrow{display:block;color:var(--blue);font-size:10px;line-height:1.3;font-weight:800;letter-spacing:.13em}.panel{min-width:0}.field-hint,.empty-copy{color:var(--mut);font-size:13px}.analyzer-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:16px}.analyzer-grid textarea{min-height:300px}.analyzer-actions{margin:18px 0}.extract-preview{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.extract-preview summary{cursor:pointer;font-weight:650}.extract-preview pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto;color:var(--mut);font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}.quality-head{display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-size:13px}.quality-meter{height:6px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0}.quality-meter i{display:block;height:100%;background:var(--blue)}.quality-warning{margin-top:8px;padding:9px 11px;background:color-mix(in srgb,var(--warn) 10%,var(--card));border-left:3px solid var(--warn);font-size:13px}.review-confirm{display:flex;align-items:flex-start;gap:8px;margin:12px 0;font-size:13px}.review-confirm input{margin-top:4px}
.workspace-head{align-items:center}.overview-grid{display:grid;grid-template-columns:1.45fr .85fr;gap:14px}.overview-feature,.overview-score{border:1px solid var(--line);border-radius:10px;padding:22px;background:var(--card)}.overview-feature{background:linear-gradient(120deg,color-mix(in srgb,var(--blue) 6%,var(--card)),var(--card) 70%)}.overview-feature-head{display:flex;justify-content:space-between;align-items:center}.overview-feature h2{margin:5px 0}.overview-feature>p,.overview-score p{color:var(--mut)}.status-dot{display:block;width:10px;height:10px;border-radius:50%;background:var(--line)}.status-dot.is-ready{background:var(--ok)}.overview-actions{display:flex;gap:8px;margin:16px 0}.overview-score{display:flex;flex-direction:column;justify-content:center}.score-value{font-size:48px;line-height:1.1;font-weight:750;letter-spacing:-.05em;margin:10px 0}.overview-score time{font-size:12px;color:var(--mut)}.overview-stats{display:grid;grid-template-columns:repeat(4,1fr);margin:14px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}.overview-stats>div{padding:15px 18px;border-right:1px solid var(--line)}.overview-stats>div:last-child{border:0}.overview-stats span,.overview-stats b{display:block}.overview-stats span{font-size:12px;color:var(--mut)}.overview-stats b{font-size:20px;margin-top:3px}.overview-lower{display:grid;grid-template-columns:1fr 1fr;gap:14px}.section-heading{display:flex;justify-content:space-between;align-items:center}.activity-row{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.activity-row:first-of-type{border-top:0}.activity-row p{margin:2px 0;color:var(--mut);font-size:13px}.activity-row time{color:var(--mut);font-size:11px}.activity-mark{width:8px;height:8px;background:var(--blue);border-radius:50%;margin-top:8px;flex:none}
.report-overview{display:grid;grid-template-columns:auto 1fr minmax(160px,.4fr);gap:22px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:14px}.report-overview h2{margin:5px 0}.report-overview p{margin:0;color:var(--mut)}.confidence-summary{display:flex;flex-direction:column;border-left:1px solid var(--line);padding-left:20px}.confidence-summary b{font-size:26px}.confidence-summary span,.confidence-summary small{color:var(--mut);font-size:12px}.report-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}.report-structure,.report-recommendations{margin:14px 0}.evidence-row{padding:12px 0;border-top:1px solid var(--line)}.evidence-row:first-of-type{border-top:0}.evidence-row blockquote{margin:6px 0 0;padding:8px 11px;background:var(--bg);border-left:2px solid var(--blue);color:var(--mut);overflow-wrap:anywhere}.bullet-suggestion{padding:14px 0;border-top:1px solid var(--line)}.suggestion-status{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700}.bullet-suggestion p{margin:8px 0;overflow-wrap:anywhere}.report-recommendations li{margin:7px 0;padding-left:3px}main{max-width:1540px;padding:28px 10px 80px}.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px 30px}.report-columns{grid-template-columns:minmax(0,1fr)}.report-columns h2{font-size:32px;margin:30px 0 18px;letter-spacing:-.01em}.report-columns .evidence-row{padding:16px 0}</style></head><body>
<header><button class="logo" data-go="home">CV<b>PILOT</b></button><nav><button class="btn" data-go="jobs">Jobs</button><button class="btn" data-go="career">Career Growth</button><button class="btn" data-go="analyze">Analyzer</button><button class="btn pri" data-go="analyze">Start audit</button></nav></header>
<main id="app"></main><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js" defer></script>
<script src="engine.js"></script><script src="docs.js"></script><script src="assistant.js"></script><script src="jobs-ui.js"></script><script src="career-engine.js"></script><script src="career-ui.js"></script><script src="app.js"></script>
</body></html>
